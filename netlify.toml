[build]
  command = "npm run build:web"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.4"

[functions]
  node_bundler = "esbuild"

# Shared friend invite and challenge links render inside the Expo web app.
[[redirects]]
  from = "/f/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/c/*"
  to = "/index.html"
  status = 200

# Expo web app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
